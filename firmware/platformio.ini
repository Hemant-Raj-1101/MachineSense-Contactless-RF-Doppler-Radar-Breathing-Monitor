; MachineSense firmware - ESP32 + FreeRTOS (Arduino framework)
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    kosme/arduinoFFT @ ^2.0.4
    links2004/WebSockets @ ^2.4.1

build_flags =
    -O2
    -Wall
    -Wno-unused-variable
    -DCORE_DEBUG_LEVEL=0
